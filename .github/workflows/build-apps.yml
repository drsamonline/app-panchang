# Build (EXE + APK) AND deploy the live demo.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: LicenseRef-Forge-Proprietary
#
# WHY THIS FILE WAS REWRITTEN
# It used to be a hand-copied 4.9 kB inline version of the builder. That copy had
# drifted: it still had `if: always()` on the release job - which DELETES the
# existing release before creating a new one, so a failed build destroys the
# published release - and it picked the EXE by a hard-coded filename. The shared
# kit already fixed both. Inline copies cannot receive fixes, so this now CALLS
# the shared workflow instead of duplicating it.
#
# It also deploys the demo. Nothing did before: the Pages workflow lived only in
# the PRIVATE forge repo, and a public repo can only call a PUBLIC reusable
# workflow - so no app demo could ever deploy. pages.yml is now published in the
# public app-builder kit and is called below.
#
# DEPLOY IS FROM MAIN ONLY. A deploy from a pull_request would overwrite the live
# site with unreviewed code, so PRs are built (and therefore checked) but never
# deployed. A merged PR is a push to main, which deploys.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-panchang
  cancel-in-progress: true

jobs:
  build:
    name: Build EXE + APK
    uses: drsamonline/app-builder/.github/workflows/build.yml@main
    with:
      app_name: panchang
      app_src: docs/play
    permissions:
      contents: write

  pages:
    name: Deploy the demo to Pages
    if: github.event_name != 'pull_request'
    uses: drsamonline/app-builder/.github/workflows/pages.yml@main
    with:
      path: docs
    permissions:
      contents: read
      pages: write
      id-token: write
